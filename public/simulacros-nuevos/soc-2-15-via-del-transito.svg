<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-labelledby="titulo-via">
  <title id="titulo-via">Esquema sin escala de la Vía del Tránsito: por tierra de San Juan del Sur a La Virgen, por el lago de Nicaragua y por el río San Juan hasta San Juan del Norte, en el Caribe</title>
  <!-- Fondo blanco propio: se ve igual en modo claro y oscuro. -->
  <rect width="480" height="360" fill="#ffffff"/>

  <!-- Mares a los lados -->
  <path d="M0 0 H52 C46 120 40 220 30 290 H0 Z" fill="#dbeafe"/>
  <path d="M480 0 H430 C436 110 444 200 450 290 H480 Z" fill="#dbeafe"/>
  <text x="30" y="250" font-family="sans-serif" font-size="17" fill="#1e3a8a" transform="rotate(-90 30 250)">Pacífico</text>
  <text x="462" y="40" font-family="sans-serif" font-size="17" fill="#1e3a8a" transform="rotate(90 462 40)">Caribe</text>

  <!-- Paises -->
  <text x="190" y="32" font-family="sans-serif" font-size="20" font-weight="bold" fill="#111827">NICARAGUA</text>
  <text x="170" y="270" font-family="sans-serif" font-size="20" font-weight="bold" fill="#111827">COSTA RICA</text>

  <!-- Lago de Nicaragua -->
  <ellipse cx="190" cy="110" rx="85" ry="45" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="2"/>
  <text x="150" y="106" font-family="sans-serif" font-size="17" fill="#1e3a8a">Lago de</text>
  <text x="142" y="126" font-family="sans-serif" font-size="17" fill="#1e3a8a">Nicaragua</text>

  <!-- Limite terrestre aproximado -->
  <path d="M48 200 C120 195 200 180 252 140" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="2 6"/>

  <!-- Rio San Juan, del lago al Caribe -->
  <path d="M252 140 C320 170 380 180 440 186" fill="none" stroke="#1e3a8a" stroke-width="6"/>
  <text x="300" y="215" font-family="sans-serif" font-size="17" fill="#1e3a8a">Río San Juan</text>

  <!-- Ruta de la Via del Transito, punteada encima -->
  <path d="M52 150 L105 128" fill="none" stroke="#b91c1c" stroke-width="4" stroke-dasharray="10 6"/>
  <path d="M105 128 C150 132 220 138 252 140" fill="none" stroke="#b91c1c" stroke-width="4" stroke-dasharray="10 6"/>
  <path d="M252 140 C320 170 380 180 440 186" fill="none" stroke="#b91c1c" stroke-width="4" stroke-dasharray="10 6"/>

  <!-- Lugares -->
  <circle cx="52" cy="150" r="6" fill="#111827"/>
  <text x="58" y="178" font-family="sans-serif" font-size="16" fill="#111827">San Juan</text>
  <text x="58" y="196" font-family="sans-serif" font-size="16" fill="#111827">del Sur</text>
  <circle cx="105" cy="128" r="6" fill="#111827"/>
  <text x="62" y="76" font-family="sans-serif" font-size="16" fill="#111827">La Virgen</text>
  <line x1="100" y1="80" x2="104" y2="121" stroke="#111827" stroke-width="1.5"/>
  <circle cx="440" cy="186" r="6" fill="#111827"/>
  <text x="352" y="146" font-family="sans-serif" font-size="16" fill="#111827">San Juan</text>
  <text x="352" y="164" font-family="sans-serif" font-size="16" fill="#111827">del Norte</text>

  <!-- Leyenda -->
  <rect x="40" y="300" width="400" height="44" fill="#ffffff" stroke="#6b7280"/>
  <line x1="54" y1="322" x2="104" y2="322" stroke="#b91c1c" stroke-width="4" stroke-dasharray="10 6"/>
  <text x="114" y="328" font-family="sans-serif" font-size="16" fill="#111827">Vía del Tránsito (esquema sin escala)</text>
</svg>
