<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 480 538' width='480' height='538' role='img' font-family='Arial, Helvetica, sans-serif'>
<title>Capas de la atmósfera numeradas del 1 al 4 según su altura: capa 1 hasta unos 12 km, capa 2 hasta unos 50 km, capa 3 hasta unos 80 km y capa 4 por encima</title>
<defs><marker id='fl' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#111827'/></marker></defs>
<rect x='0' y='0' width='480' height='538' fill='#ffffff'/>
<text x='240' y='30' font-size='20' text-anchor='middle' font-weight='bold' fill='#111827'>Altura sobre la superficie</text>
<line x1='132' y1='492' x2='132' y2='50' stroke='#111827' stroke-width='2'/>
<rect x='142' y='50' width='323' height='120' fill='#fae8ff' stroke='#111827' stroke-width='2'/>
<text x='303.5' y='118.0' font-size='22' text-anchor='middle' font-weight='bold' fill='#111827'>Capa 4</text>
<rect x='142' y='170' width='323' height='120' fill='#ede9fe' stroke='#111827' stroke-width='2'/>
<text x='303.5' y='238.0' font-size='22' text-anchor='middle' font-weight='bold' fill='#111827'>Capa 3</text>
<rect x='142' y='290' width='323' height='152' fill='#e0e7ff' stroke='#111827' stroke-width='2'/>
<text x='303.5' y='374.0' font-size='22' text-anchor='middle' font-weight='bold' fill='#111827'>Capa 2</text>
<rect x='142' y='442' width='323' height='50' fill='#dbeafe' stroke='#111827' stroke-width='2'/>
<text x='303.5' y='475.0' font-size='22' text-anchor='middle' font-weight='bold' fill='#111827'>Capa 1</text>
<line x1='124' y1='492' x2='140' y2='492' stroke='#111827' stroke-width='2'/>
<text x='120' y='498' font-size='18' text-anchor='end' font-weight='normal' fill='#111827'>0 km</text>
<line x1='124' y1='442' x2='140' y2='442' stroke='#111827' stroke-width='2'/>
<text x='120' y='448' font-size='18' text-anchor='end' font-weight='normal' fill='#111827'>unos 12 km</text>
<line x1='124' y1='290' x2='140' y2='290' stroke='#111827' stroke-width='2'/>
<text x='120' y='296' font-size='18' text-anchor='end' font-weight='normal' fill='#111827'>unos 50 km</text>
<line x1='124' y1='170' x2='140' y2='170' stroke='#111827' stroke-width='2'/>
<text x='120' y='176' font-size='18' text-anchor='end' font-weight='normal' fill='#111827'>unos 80 km</text>
<text x='120' y='70' font-size='18' text-anchor='end' font-weight='normal' fill='#111827'>más arriba</text>
<rect x='142' y='492' width='323' height='32' fill='#d6d3d1' stroke='#111827' stroke-width='2'/>
<text x='303.5' y='514' font-size='17' text-anchor='middle' font-weight='normal' fill='#111827'>superficie terrestre</text>
</svg>
