<line x1='330' y1='215' x2='530' y2='165' stroke='#1f2937' stroke-width='1.5'/>
<text x='440' y='220' font-size='17' text-anchor='middle' font-weight='bold' fill='#1f2937'>azúcar</text>
<line x1='380' y1='400' x2='330' y2='450' stroke='#1f2937' stroke-width='3'/>
<line x1='380' y1='400' x2='360' y2='450' stroke='#1f2937' stroke-width='3'/>
<line x1='380' y1='400' x2='400' y2='450' stroke='#1f2937' stroke-width='3'/>
<line x1='380' y1='400' x2='430' y2='450' stroke='#1f2937' stroke-width='3'/>
<text x='470' y='465' font-size='15' text-anchor='middle' font-weight='normal' fill='#1f2937'>raíces</text>
<line x1='135' y1='105' x2='320' y2='165' stroke='#1f2937' stroke-width='2.5' marker-end='url(#fl)'/>
<text x='215' y='115' font-size='17' text-anchor='middle' font-weight='bold' fill='#1f2937'>luz</text>
