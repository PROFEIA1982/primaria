<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 480' width='800' height='480' role='img' font-family='Arial, Helvetica, sans-serif'>
<title>Planta en fotosíntesis: entran luz del Sol, agua desde las raíces y una sustancia X desde el aire; sale una sustancia Y hacia el aire; en la hoja se forma azúcar</title>
<defs><marker id='fl' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1f2937'/></marker></defs>
<rect x='0' y='0' width='800' height='480' fill='#ffffff'/>
<circle cx='90' cy='80' r='45' fill='#fde68a' stroke='#1f2937' stroke-width='2'/>
<text x='90' y='86' font-size='18' text-anchor='middle' font-weight='bold' fill='#1f2937'>Sol</text>
<line x1='40' y1='400' x2='760' y2='400' stroke='#1f2937' stroke-width='2'/>
<text x='720' y='425' font-size='15' text-anchor='middle' font-weight='normal' fill='#1f2937'>suelo</text>
<line x1='380' y1='400' x2='380' y2='230' stroke='#1f2937' stroke-width='6'/>
