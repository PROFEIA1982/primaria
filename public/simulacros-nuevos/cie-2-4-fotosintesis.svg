<line x1='720' y1='260' x2='545' y2='215' stroke='#1f2937' stroke-width='3' marker-end='url(#fl)'/>
<text x='740' y='270' font-size='24' text-anchor='middle' font-weight='bold' fill='#1f2937'>X</text>
<line x1='540' y1='160' x2='710' y2='90' stroke='#1f2937' stroke-width='3' marker-end='url(#fl)'/>
<text x='730' y='85' font-size='24' text-anchor='middle' font-weight='bold' fill='#1f2937'>Y</text>
