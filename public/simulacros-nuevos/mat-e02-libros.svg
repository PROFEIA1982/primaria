    <text x="72" y="185">20</text>
    <text x="72" y="150">30</text>
    <text x="72" y="115">40</text>
    <text x="72" y="80">50</text>
    <text x="72" y="45">60</text>
  </g>
  <rect x="100" y="82" width="56" height="168" fill="#2457f5" stroke="#1b3a5b" stroke-width="1.5"/>
