  <text x="250" y="304" text-anchor="middle" font-family="'Segoe UI', Nunito, Arial, sans-serif" font-size="16" font-weight="700" fill="#1a1a1a">Grupo</text>
  <text transform="translate(24 140) rotate(-90)" text-anchor="middle" font-family="'Segoe UI', Nunito, Arial, sans-serif" font-size="16" font-weight="700" fill="#1a1a1a">Cantidad de libros</text>
