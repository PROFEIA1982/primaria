  <text x="288" y="274" text-anchor="middle" font-family="'Segoe UI', Nunito, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1a1a">6-3</text>
  <rect x="340" y="54" width="56" height="196" fill="#2457f5" stroke="#1b3a5b" stroke-width="1.5"/>
  <text x="368" y="46" text-anchor="middle" font-family="'Segoe UI', Nunito, Arial, sans-serif" font-size="18" font-weight="800" fill="#1a1a1a">56</text>
  <text x="368" y="274" text-anchor="middle" font-family="'Segoe UI', Nunito, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1a1a">6-4</text>
