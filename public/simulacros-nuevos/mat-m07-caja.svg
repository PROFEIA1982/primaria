<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 290" width="470" height="290" role="img" aria-labelledby="t">
  <title id="t">Caja con forma de prisma rectangular de 20 cm de largo, 10 cm de ancho y 15 cm de alto, y un cubito de 5 cm de arista.</title>
  <rect x="1" y="1" width="468" height="288" rx="14" fill="#ffffff" stroke="#c9d3dd" stroke-width="2"/>
  <g transform="translate(28 0)">
  <g stroke="#1b3a5b" stroke-width="3" stroke-linejoin="round">
    <polygon points="60,90 120,50 320,50 260,90" fill="#f6d7a7"/>
    <polygon points="260,90 320,50 320,200 260,240" fill="#e2b77a"/>
    <rect x="60" y="90" width="200" height="150" fill="#f1c88c"/>
  </g>
  <g font-family="'Segoe UI', Nunito, Arial, sans-serif" font-size="19" font-weight="700" fill="#1a1a1a">
    <text x="160" y="268" text-anchor="middle">20 cm</text>
    <text x="50" y="171" text-anchor="end">15 cm</text>
    <text x="300" y="242">10 cm</text>
  </g>
  <g stroke="#1b3a5b" stroke-width="2.5" stroke-linejoin="round">
    <polygon points="360,180 375,170 425,170 410,180" fill="#cfe3f7"/>
    <polygon points="410,180 425,170 425,220 410,230" fill="#9cc3ea"/>
    <rect x="360" y="180" width="50" height="50" fill="#b6d3f1"/>
  </g>
  <text x="385" y="256" text-anchor="middle" font-family="'Segoe UI', Nunito, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1a1a">5 cm</text>
  </g>
</svg>
