<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 360" width="390" height="360" role="img" aria-labelledby="t">
  <title id="t">Patrón para armar: tres rectángulos iguales en fila y un triángulo arriba y otro abajo del rectángulo del centro. Las líneas de doblez son punteadas.</title>
  <rect x="1" y="1" width="388" height="358" rx="14" fill="#ffffff" stroke="#c9d3dd" stroke-width="2"/>
  <g fill="#fde3c8">
    <rect x="60" y="111" width="270" height="140"/>
    <polygon points="150,111 240,111 195,33"/>
    <polygon points="150,251 240,251 195,329"/>
  </g>
  <path d="M60,111 H150 L195,33 L240,111 H330 V251 H240 L195,329 L150,251 H60 Z" fill="none" stroke="#1b3a5b" stroke-width="3.5" stroke-linejoin="round"/>
  <g stroke="#1b3a5b" stroke-width="2.5" stroke-dasharray="8 6">
    <line x1="150" y1="111" x2="150" y2="251"/>
    <line x1="240" y1="111" x2="240" y2="251"/>
    <line x1="150" y1="111" x2="240" y2="111"/>
    <line x1="150" y1="251" x2="240" y2="251"/>
  </g>
</svg>
