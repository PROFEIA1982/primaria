<text x='690' y='150' font-size='18' text-anchor='middle' font-weight='bold' fill='#1f2937'>Luna</text>
<text x='400' y='300' font-size='15' text-anchor='middle' font-weight='normal' fill='#1f2937'>Esquema sin escala</text>
