<rect x='0' y='0' width='800' height='320' fill='#ffffff'/>
<polygon points='445,138 445,222 760,190 760,170' fill='#9ca3af' stroke='#1f2937' stroke-width='1.5' stroke-dasharray='6 4'/>
<text x='600' y='245' font-size='15' text-anchor='middle' font-weight='normal' fill='#1f2937'>sombra de la Tierra</text>
<line x1='170' y1='110' x2='380' y2='145.0' stroke='#1f2937' stroke-width='2' marker-end='url(#fl)'/>
