<text x='100' y='186' font-size='20' text-anchor='middle' font-weight='bold' fill='#1f2937'>Sol</text>
<circle cx='420' cy='180' r='42' fill='#bfdbfe' stroke='#1f2937' stroke-width='2.5'/>
